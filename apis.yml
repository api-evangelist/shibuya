name: Shibuya
description: Shibuya is a platform for curated short films and the independent creators
  behind them, describing itself as a home where fans help greenlight the future of
  film and audiences discover original storytelling. Operated by NotShibuya, Inc.
  and backed by a16z, Shibuya began as a web3 storytelling experiment and has grown
  into a community-driven curation platform for short-form film, winning a 2025 Primetime
  Emmy for Outstanding Innovation in Emerging Media Programming. It was surfaced as
  a portfolio company of a16z and added to the API Evangelist network. As of this
  enrichment pass Shibuya publishes no public developer program, API, SDK, or documentation
  surface; this profile captures its real public web properties.
